<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXUS INFRA</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style type="text/tailwindcss">
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}
.inp{@apply w-full border border-slate-300 rounded-lg px-3 py-2 mt-1 text-sm bg-white}
.btn{@apply bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-2 rounded-lg text-sm font-medium}
.btn2{@apply border border-slate-300 bg-white px-3 py-2 rounded-lg text-sm hover:bg-slate-50}
.card{@apply bg-white rounded-xl shadow-sm border border-slate-200 p-4}
.nav{@apply block w-full text-left px-4 py-2.5 text-sm text-slate-300 hover:bg-white/10 rounded-lg}
.nav.on{@apply bg-cyan-500/20 text-cyan-300}
th{@apply text-left text-xs uppercase text-slate-500 px-2 py-2}td{@apply px-2 py-2 border-t border-slate-100 text-sm}
@media print{aside,header,.np{display:none!important}main{margin:0!important}}
</style></head>
<body>
<aside id="sb" class="fixed inset-y-0 left-0 w-60 bg-[#0b1f3a] p-3 z-30 -translate-x-full md:translate-x-0 transition-transform">
<div class="flex items-center gap-2 px-2 py-4"><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#06b6d4"/><path d="M5 22h22M8 22V12l8-5 8 5v10M13 22v-6h6v6" stroke="#0b1f3a" stroke-width="2" fill="none"/></svg><div><div class="text-white font-bold leading-4">NEXUS INFRA</div><div class="text-[10px] text-cyan-300">Evidence-Linked Infrastructure Intelligence</div></div></div>
<nav id="nav"></nav></aside>
<div class="md:ml-60"><header class="bg-[#0b1f3a] text-white px-4 py-3 flex items-center gap-3 np"><button class="md:hidden text-2xl" onclick="sb.classList.toggle('-translate-x-full')">☰</button><span class="text-sm flex-1">Prototype · Demo data</span>
<label class="text-xs">Demo role switch: <select id="role" class="text-slate-900 rounded px-1 py-1" onchange="S.role=this.value;save();render()"><option>Administrator</option><option>Engineer</option></select></label></header>
<main id="main" class="p-4 md:p-6 max-w-6xl"></main></div>
<div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"><div id="mb" class="bg-white rounded-xl p-5 w-full max-w-lg max-h-[90vh] overflow-auto"></div></div>
<div id="toast" class="fixed bottom-4 right-4 z-[60]"></div>
<script>
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T0=new Date('2026-10-24T00:00:00'),d=n=>{const x=new Date(T0);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},TODAY=d(0);
const ENG=['A. Ramesh','S. Priya','K. Venkat'],CATS=['cracks','corrosion','surface damage','waterlogging','deformation','drainage problems','general inspection'],TYPES=['bridge','road','building','drainage','other'],CONDS=['good','fair','poor','critical'],PRI=['low','medium','high','urgent'],ST=['planned','assigned','in progress','completed','requires follow-up'];
const COL={good:'bg-emerald-100 text-emerald-800',fair:'bg-sky-100 text-sky-800',poor:'bg-amber-100 text-amber-800',critical:'bg-red-100 text-red-800',low:'bg-slate-100 text-slate-700',medium:'bg-sky-100 text-sky-800',high:'bg-amber-100 text-amber-800',urgent:'bg-red-100 text-red-800',completed:'bg-emerald-100 text-emerald-800',reviewed:'bg-emerald-100 text-emerald-800','requires follow-up':'bg-amber-100 text-amber-800','requires urgent professional review':'bg-red-100 text-red-800'};
const bd=t=>`<span class="px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${COL[t]||'bg-slate-100 text-slate-700'}">${esc(t)}</span>`;
const ph=(t,h)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260"><rect width="400" height="260" fill="hsl(${h},25%,35%)"/><path d="M0 200L400 170V260H0Z" fill="rgba(0,0,0,.25)"/><text x="200" y="120" fill="#fff" font-size="18" text-anchor="middle" font-family="sans-serif">Illustrative sample image</text><text x="200" y="146" fill="#cfe" font-size="14" text-anchor="middle" font-family="sans-serif">${t}</text></svg>`);
const AI={cracks:['Concrete cracking','Linear surface cracks appear in the frame; width, depth and orientation cannot be measured from an image.','Crack-like lines across the central surface','medium','Measure crack width with a gauge; mark ends and re-inspect in 30 days; check for staining or spalling.'],
corrosion:['Corrosion','Orange-brown discolouration consistent with possible rust on exposed metal or reinforcement.','Discoloured patch near the lower edge','high','Inspect section loss with hammer sounding and wire brush; record extent; engineer to assess coating condition.'],
'surface damage':['Road surface damage','Surface loss or pothole-like irregularities visible; subsurface condition is unknown.','Irregular dark patches on the surface','medium','Survey affected length; check drainage and base layer; schedule patching assessment.'],
waterlogging:['Water damage','Standing water or damp staining visible; source and duration cannot be determined.','Reflective wet area at the base','medium','Identify water source; check outlets for blockage; re-inspect after rainfall.'],
deformation:['Other or uncertain','Possible misalignment or sagging; perspective in a photo can mislead.','Edge lines appear uneven','requires urgent professional review','Take levelling survey; engineer to examine on site before any use decision.'],
'drainage problems':['Drainage obstruction','Debris or silt appears to partially block the drain opening.','Material accumulation at the inlet','medium','Clear obstruction safely; inspect downstream flow; record before and after.'],
'general inspection':['Other or uncertain','No clear defect identified; image may not show critical elements.','General view of the asset','low','Continue routine inspection; capture close-ups of joints and bearings.']};
const LIM='Single image only; no scale, measurements, load or structural data. Preliminary decision support, not a certified assessment. A qualified engineer must review before any action.';
function seed(){const n=Date.now();const S={role:'Administrator',c:{e:12,a:6,t:8,s:8},assets:[],evidence:[],analyses:[],tasks:[],log:[]};
[['BR-001','Cauvery River Bridge, Srirangam','bridge','Tiruchirappalli, Tamil Nadu',1976,'Highways Dept','poor',-200,-5],['BR-002','Palar Rail-over-Road Bridge','bridge','Chengalpattu, Tamil Nadu',1998,'Highways Dept','fair',-90,60],['RD-001','ECR Road Section km 42-48','road','Mahabalipuram, Tamil Nadu',2008,'PWD','fair',-120,20],['RD-002','NH-48 Service Road','road','Kanchipuram, Tamil Nadu',2015,'NHAI','good',-30,150],['BL-001','Govt. School Block C','building','Villupuram, Tamil Nadu',1989,'Education Infra','poor',-150,10],['BL-002','District Hospital Annex','building','Vellore, Tamil Nadu',2003,'Health Infra','critical',-60,-12],['DR-001','Storm Drain Network Zone 4','drainage','Chennai, Tamil Nadu',2011,'Municipal Corp','poor',-75,15],['DR-002','Canal Culvert Line 7','drainage','Thanjavur, Tamil Nadu',1995,'Water Resources','fair',-45,90]].forEach((a,i)=>S.assets.push({id:'a'+(i+1),code:a[0],name:a[1],type:a[2],loc:a[3],year:a[4],dept:a[5],cond:a[6],last:d(a[7]),next:d(a[8]),notes:'Demo record (fictional).',arch:false}));
[[0,'cracks','pending'],[0,'corrosion','reviewed'],[1,'surface damage','reviewed'],[2,'surface damage','pending'],[2,'waterlogging','pending'],[3,'general inspection','reviewed'],[4,'cracks','pending'],[4,'corrosion','pending'],[5,'cracks','reviewed'],[6,'drainage problems','pending'],[6,'waterlogging','reviewed'],[7,'drainage problems','pending']].forEach((e,i)=>S.evidence.push({id:'E-'+(i+1),aid:'a'+(e[0]+1),name:'sample_'+e[1].replace(' ','_')+'.jpg',ftype:'image/jpeg',cat:e[1],desc:'Illustrative sample evidence (demo).',by:ENG[i%3],status:e[2],idate:d(-10-i*5),url:null,demo:true,created:d(-10-i*5)}));
[0,1,2,6,8,9].forEach((ei,i)=>{const e=S.evidence[ei];S.analyses.push({id:'A-'+(i+1),aid:e.aid,eid:e.id,...mk(e),status:i%2?'reviewed':'pending',comments:'',demo:true,created:d(-8-i)})});
[[0,'Bearing and crack survey','urgent','assigned',-3,'A-1'],[5,'Structural crack assessment','urgent','in progress',-1,null],[4,'Verify corrosion near beams','high','planned',5,'A-6'],[2,'Pothole patch survey','medium','assigned',9,null],[6,'Drain clearing check','medium','planned',12,'A-5'],[1,'Annual deck inspection','low','completed',-20,null],[3,'Routine service road check','low','requires follow-up',3,null],[7,'Culvert silt inspection','high','planned',20,null]].forEach((t,i)=>S.tasks.push({id:'T-'+(i+1),aid:'a'+(t[0]+1),title:t[1],desc:'Demo inspection task.',pri:t[2],eng:ENG[i%3],due:d(t[4]),status:t[3],anid:t[5],notes:'',summary:t[3]=='completed'?'Inspection done; minor issues recorded (demo).':'',created:d(-15)}));
S.log=['Demo data loaded'];return S}
function mk(e){const a=AI[e.cat];return{cat:a[0],obs:a[1],vis:a[2],sev:a[3],conf:'Not provided',steps:a[4],lim:LIM}}
let S;try{S=JSON.parse(localStorage.getItem('nx'))}catch(e){}S=S||seed();
function save(){try{localStorage.setItem('nx',JSON.stringify(S))}catch(e){toast('Browser storage full; changes last only for this session.',1)}}
function toast(m,err){const t=document.createElement('div');t.className='mb-2 px-4 py-2 rounded-lg text-white text-sm shadow '+(err?'bg-red-600':'bg-emerald-600');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),3500)}
function log(m){S.log.unshift(TODAY+': '+m);S.log=S.log.slice(0,15)}
const M=h=>{$('#mb').innerHTML=h;$('#modal').classList.remove('hidden');$('#modal').classList.add('flex')},X=()=>{$('#modal').classList.add('hidden');$('#modal').classList.remove('flex')};
const nid=k=>({e:'E-',a:'A-',t:'T-',s:'a'}[k]+(++S.c[k]));
const A=id=>S.assets.find(a=>a.id==id),aname=id=>{const a=A(id);return a?a.code+' · '+a.name:'-'},live=()=>S.assets.filter(a=>!a.arch),adm=()=>S.role=='Administrator';
const ev=id=>S.evidence.find(e=>e.id==id),img=e=>e.url||ph(e.cat,{cracks:200,corrosion:20,'surface damage':220,waterlogging:190}[e.cat]||210);
const opts=(l,v)=>l.map(x=>`<option ${v==x?'selected':''}>${x}</option>`).join('');
const aopts=(v,all)=>(all?'<option value="">All assets</option>':'')+live().map(a=>`<option value="${a.id}" ${v==a.id?'selected':''}>${esc(a.code+' · '+a.name)}</option>`).join('');
function fm(title,fields,cb,v={}){M(`<h3 class="font-semibold text-lg mb-3">${title}</h3><form id="f" class="space-y-3">${fields.map(([n,l,t,o,r])=>`<label class="block text-sm">${l}${r?' *':''}${t=='select'?`<select name="${n}" class="inp">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}" ${v[n]==a?'selected':''}>${esc(b)}</option>`}).join('')}</select>`:t=='textarea'?`<textarea name="${n}" rows="3" class="inp">${esc(v[n]||'')}</textarea>`:`<input name="${n}" type="${t}" value="${esc(v[n]??'')}" ${t=='file'?`accept="${o||''}"`:''} class="inp">`}</label>`).join('')}<p id="fe" class="text-sm text-red-600"></p><div class="flex justify-end gap-2"><button type="button" onclick="X()" class="btn2">Cancel</button><button class="btn">Save</button></div></form>`);
$('#f').onsubmit=async e=>{e.preventDefault();const f=e.target,vals={};for(const[n,,t,,r]of fields){vals[n]=t=='file'?f[n].files[0]:f[n].value.trim();if(r&&!vals[n]){$('#fe').textContent='Please fill all required fields (*).';return}}const err=await cb(vals);if(err)$('#fe').textContent=err;else{X();render()}}}
const cnt=(arr,f)=>arr.reduce((m,x)=>(m[f(x)]=(m[f(x)]||0)+1,m),{});
const bars=(o,cls)=>{const mx=Math.max(1,...Object.values(o));return Object.keys(o).length?Object.entries(o).map(([k,v])=>`<div class="flex items-center gap-2 text-sm mb-1.5"><span class="w-32 truncate capitalize">${esc(k)}</span><div class="flex-1 bg-slate-100 rounded h-4"><div class="${cls||'bg-cyan-500'} h-4 rounded" style="width:${v/mx*100}%"></div></div><b class="w-6">${v}</b></div>`).join(''):'<p class="text-sm text-slate-500">No data yet.</p>'};
const overdue=t=>t.status!='completed'&&t.due<TODAY,stat=a=>a.next<TODAY?'overdue':a.next<=d(30)?'due soon':'on schedule';
const V={};
V.dashboard=()=>{const as=live(),open=S.tasks.filter(t=>t.status!='completed'),pend=S.evidence.filter(e=>e.status=='pending');
const k=[['Total assets',as.length],['Need inspection (≤30 days)',as.filter(a=>stat(a)!='on schedule').length],['Evidence awaiting review',pend.length],['Open tasks',open.length]];
return`<h1 class="text-2xl font-bold mb-4">Dashboard</h1><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${k.map(([l,v])=>`<div class="card"><div class="text-xs text-slate-500">${l}</div><div class="text-3xl font-bold text-cyan-700">${v}</div></div>`).join('')}</div>
<div class="grid md:grid-cols-2 gap-4"><div class="card"><h3 class="font-semibold mb-2">Condition distribution</h3>${bars(cnt(as,a=>a.cond))}</div><div class="card"><h3 class="font-semibold mb-2">Defects by category (AI analyses)</h3>${bars(cnt(S.analyses,a=>a.cat),'bg-blue-600')}</div>
<div class="card"><h3 class="font-semibold mb-2">Upcoming inspections</h3>${open.sort((a,b)=>a.due<b.due?-1:1).slice(0,5).map(t=>`<div class="text-sm py-1.5 border-t first:border-0 flex justify-between gap-2"><a class="text-cyan-700" href="#planner">${esc(t.title)}</a><span class="${overdue(t)?'text-red-600 font-medium':''}">${t.due}${overdue(t)?' (overdue)':''}</span></div>`).join('')||'<p class="text-sm text-slate-500">No open tasks.</p>'}</div>
<div class="card"><h3 class="font-semibold mb-2">Recent activity</h3>${S.log.slice(0,6).map(l=>`<div class="text-sm py-1 border-t first:border-0">${esc(l)}</div>`).join('')||'<p class="text-sm text-slate-500">No activity yet.</p>'}</div></div>`};
const AF={q:'',t:'',c:'',i:'',v:'table'};
V.assets=()=>{setTimeout(alist);return`<div class="flex flex-wrap items-center gap-2 mb-4"><h1 class="text-2xl font-bold flex-1">Infrastructure Assets</h1>${adm()?'<button class="btn" onclick="assetForm()">+ Add asset</button>':'<span class="text-xs text-slate-500">Adding assets is Administrator-only</span>'}</div>
<div class="card mb-3 grid sm:grid-cols-5 gap-2"><input class="inp !mt-0 sm:col-span-2" placeholder="Search name, ID or location" value="${esc(AF.q)}" oninput="AF.q=this.value;alist()"><select class="inp !mt-0" onchange="AF.t=this.value;alist()"><option value="">All types</option>${opts(TYPES,AF.t)}</select><select class="inp !mt-0" onchange="AF.c=this.value;alist()"><option value="">All conditions</option>${opts(CONDS,AF.c)}</select><select class="inp !mt-0" onchange="AF.i=this.value;alist()"><option value="">Any inspection status</option>${opts(['overdue','due soon','on schedule'],AF.i)}</select></div>
<div class="mb-2 text-sm"><button class="btn2" onclick="AF.v=AF.v=='table'?'cards':'table';alist()">Toggle table / card view</button></div><div id="list"></div>`};
function alist(){const q=AF.q.toLowerCase(),l=live().filter(a=>(!q||(a.name+a.code+a.loc).toLowerCase().includes(q))&&(!AF.t||a.type==AF.t)&&(!AF.c||a.cond==AF.c)&&(!AF.i||stat(a)==AF.i));if(!$('#list'))return;
$('#list').innerHTML=!l.length?'<div class="card text-slate-500 text-sm">No assets match. Adjust filters or add an asset.</div>':AF.v=='table'?`<div class="card overflow-x-auto"><table class="w-full"><tr><th>ID</th><th>Name</th><th>Type</th><th>Location</th><th>Condition</th><th>Next due</th></tr>${l.map(a=>`<tr><td>${a.code}</td><td><a class="text-cyan-700 font-medium" href="#asset/${a.id}">${esc(a.name)}</a></td><td class="capitalize">${a.type}</td><td>${esc(a.loc)}</td><td>${bd(a.cond)}</td><td class="${stat(a)=='overdue'?'text-red-600 font-medium':''}">${a.next}</td></tr>`).join('')}</table></div>`:`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${l.map(a=>`<a href="#asset/${a.id}" class="card block hover:border-cyan-400"><div class="text-xs text-slate-500">${a.code} · ${a.type}</div><div class="font-semibold">${esc(a.name)}</div><div class="text-sm text-slate-600 mb-2">${esc(a.loc)}</div>${bd(a.cond)} <span class="text-xs ml-1">Next: ${a.next} (${stat(a)})</span></a>`).join('')}</div>`}
function assetForm(id){const a=id?A(id):{};fm(id?'Edit asset':'Add asset',[['code','Asset ID','text',0,1],['name','Name','text',0,1],['type','Type','select',TYPES],['loc','Location','text',0,1],['year','Construction year','number'],['dept','Responsible department','text',0,1],['cond','Condition','select',CONDS],['last','Last inspection','date'],['next','Next inspection due','date',0,1],['notes','Notes','textarea']],v=>{if(v.year&&(v.year<1800||v.year>2026))return'Year must be between 1800 and 2026.';if(S.assets.some(x=>x.code==v.code&&x.id!=id))return'Asset ID already exists.';
if(id)Object.assign(a,v);else S.assets.push({id:nid('s'),arch:false,...v});log((id?'Edited ':'Added ')+v.code);save();toast('Asset saved.')},id?{...a}:{type:'bridge',cond:'good'})}
function archive(id){M(`<p class="mb-4">Archive <b>${esc(aname(id))}</b>? Its evidence and tasks are kept. This hides it from active lists.</p><div class="flex justify-end gap-2"><button class="btn2" onclick="X()">Cancel</button><button class="btn" onclick="A('${id}').arch=true;log('Archived '+A('${id}').code);save();X();location.hash='assets';render()">Archive</button></div>`)}
V.asset=id=>{const a=A(id);if(!a)return'<div class="card">Asset not found.</div>';const es=S.evidence.filter(e=>e.aid==id),an=S.analyses.filter(x=>x.aid==id),ts=S.tasks.filter(t=>t.aid==id);
return`<a href="#assets" class="text-sm text-cyan-700">← Assets</a><div class="flex flex-wrap gap-2 items-center my-2"><h1 class="text-2xl font-bold flex-1">${esc(a.name)}</h1>${adm()?`<button class="btn2" onclick="assetForm('${id}')">Edit</button><button class="btn2" onclick="archive('${id}')">Archive</button>`:''}</div>
<div class="card mb-4 grid sm:grid-cols-3 gap-2 text-sm"><div><b>ID:</b> ${a.code}</div><div><b>Type:</b> ${a.type}</div><div><b>Location:</b> ${esc(a.loc)}</div><div><b>Built:</b> ${a.year||'-'}</div><div><b>Dept:</b> ${esc(a.dept)}</div><div><b>Condition:</b> ${bd(a.cond)}</div><div><b>Last inspection:</b> ${a.last||'-'}</div><div><b>Next due:</b> ${a.next} (${stat(a)})</div><div class="sm:col-span-3"><b>Notes:</b> ${esc(a.notes)}</div></div>
<div class="grid md:grid-cols-3 gap-4"><div class="card"><h3 class="font-semibold mb-2">Evidence (${es.length})</h3>${es.map(e=>`<div class="text-sm py-1 border-t first:border-0"><a class="text-cyan-700" href="#" onclick="evDetail('${e.id}');return false">${e.id} ${e.cat}</a> ${bd(e.status)}</div>`).join('')||'<p class="text-sm text-slate-500">None yet.</p>'}</div>
<div class="card"><h3 class="font-semibold mb-2">AI analyses (${an.length})</h3>${an.map(x=>`<div class="text-sm py-1 border-t first:border-0">${x.id} ${esc(x.cat)} ${bd(x.status)}</div>`).join('')||'<p class="text-sm text-slate-500">None yet.</p>'}</div>
<div class="card"><h3 class="font-semibold mb-2">Tasks / history (${ts.length})</h3>${ts.map(t=>`<div class="text-sm py-1 border-t first:border-0">${t.id} ${esc(t.title)} ${bd(t.status)}</div>`).join('')||'<p class="text-sm text-slate-500">None yet.</p>'}</div></div>`};
const EF={q:'',a:'',c:'',s:''};
V.evidence=()=>{setTimeout(elist);return`<div class="flex flex-wrap gap-2 items-center mb-4"><h1 class="text-2xl font-bold flex-1">Evidence Centre</h1><button class="btn" onclick="upForm()">+ Upload evidence</button></div>
<div class="card mb-3 grid sm:grid-cols-4 gap-2"><input class="inp !mt-0" placeholder="Search" value="${esc(EF.q)}" oninput="EF.q=this.value;elist()"><select class="inp !mt-0" onchange="EF.a=this.value;elist()">${aopts(EF.a,1)}</select><select class="inp !mt-0" onchange="EF.c=this.value;elist()"><option value="">All categories</option>${opts(CATS,EF.c)}</select><select class="inp !mt-0" onchange="EF.s=this.value;elist()"><option value="">Any status</option>${opts(['pending','reviewed'],EF.s)}</select></div><div id="list"></div><p class="text-xs text-slate-500 mt-3">Uploads are stored in this browser only (localStorage) and may not persist across devices or sessions. Seed images are illustrative placeholders.</p>`};
function elist(){const q=EF.q.toLowerCase(),l=S.evidence.filter(e=>(!q||(e.name+e.desc+e.id).toLowerCase().includes(q))&&(!EF.a||e.aid==EF.a)&&(!EF.c||e.cat==EF.c)&&(!EF.s||e.status==EF.s));if(!$('#list'))return;
$('#list').innerHTML=l.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${l.map(e=>`<div class="card"><div class="bg-slate-100 rounded h-32 mb-2 overflow-hidden flex items-center justify-center">${e.ftype.startsWith('image')?`<img src="${img(e)}" class="h-32 w-full object-cover" alt="">`:'<span class="text-slate-500 text-sm">'+esc(e.ftype)+'</span>'}</div><div class="text-sm font-medium truncate">${esc(e.name)}</div><div class="text-xs text-slate-500 mb-1">${e.id} · ${esc(aname(e.aid))}</div>${bd(e.cat)} ${bd(e.status)}<div class="mt-2 flex gap-2"><button class="btn2 !py-1" onclick="evDetail('${e.id}')">Details</button>${e.status=='pending'?`<button class="btn2 !py-1" onclick="revEv('${e.id}')">Mark reviewed</button>`:''}</div></div>`).join('')}</div>`:'<div class="card text-sm text-slate-500">No evidence found. Upload a file to get started.</div>'}
function revEv(id){ev(id).status='reviewed';log('Evidence '+id+' reviewed');save();toast('Marked reviewed.');render()}
function evDetail(id){const e=ev(id),an=S.analyses.filter(x=>x.eid==id);M(`<h3 class="font-semibold text-lg">${e.id} · ${esc(e.name)}</h3>${e.ftype.startsWith('image')?`<img src="${img(e)}" class="rounded my-2 w-full" alt="">`:''}<div class="text-sm space-y-1"><div>Asset: ${esc(aname(e.aid))}</div><div>Type: ${esc(e.ftype)} · Category: ${e.cat} · ${bd(e.status)}</div><div>Uploaded by ${esc(e.by)} on ${e.created} · Inspection date: ${e.idate||'-'}</div><div>${esc(e.desc)}</div><div class="font-medium pt-2">Analyses</div>${an.map(x=>`<div>${x.id}: ${esc(x.cat)} (${x.sev}) ${bd(x.status)}${x.demo?' · demo':''}</div>`).join('')||'<div class="text-slate-500">None yet. Run one from AI Defect Analysis.</div>'}</div><div class="text-right mt-3"><button class="btn2" onclick="X()">Close</button></div>`)}
function upForm(){if(!live().length)return toast('Add an asset first.',1);fm('Upload evidence',[['aid','Linked asset','select',live().map(a=>[a.id,a.code+' · '+a.name])],['file','File (JPG, PNG, WEBP, PDF, TXT; max 2 MB)','file','.jpg,.jpeg,.png,.webp,.pdf,.txt',1],['cat','Category','select',CATS],['desc','Description','textarea'],['idate','Inspection date','date']],v=>new Promise(res=>{const f=v.file,ok=['image/jpeg','image/png','image/webp','application/pdf','text/plain'];if(!ok.includes(f.type))return res('Unsupported file type.');if(f.size>2097152)return res('File is larger than 2 MB.');
const r=new FileReader();r.onerror=()=>res('Could not read the file. Nothing was uploaded.');r.onload=()=>{S.evidence.push({id:nid('e'),aid:v.aid,name:f.name,ftype:f.type,cat:v.cat,desc:v.desc||'-',by:S.role=='Engineer'?ENG[0]:'Administrator',status:'pending',idate:v.idate,url:f.type.startsWith('image')?r.result:null,demo:false,created:TODAY});log('Uploaded '+f.name);save();toast('Evidence uploaded.');res()};r.readAsDataURL(f)}),{cat:'cracks'})}
let CUR=null;
V.analysis=()=>{setTimeout(()=>{fillEv();rpanel()});return`<h1 class="text-2xl font-bold mb-1">AI Defect Analysis</h1><div class="card mb-4 bg-amber-50 border-amber-300 text-sm"><b>Demo AI Mode.</b> No AI API is connected in this build, so results are template findings chosen by evidence category, not real image inference. Output is preliminary decision support; a qualified engineer must review it. It never declares an asset safe or unsafe.</div>
<div class="card mb-4 grid sm:grid-cols-3 gap-2 items-end"><label class="text-sm">Asset<select id="sa" class="inp" onchange="fillEv()">${aopts()}</select></label><label class="text-sm">Evidence<select id="se" class="inp"></select></label><button class="btn" onclick="runAI()">Analyse Evidence</button></div><div id="rp"></div><h3 class="font-semibold mt-6 mb-2">Previous analyses</h3><div class="card overflow-x-auto"><table class="w-full"><tr><th>ID</th><th>Asset</th><th>Category</th><th>Severity</th><th>Status</th><th></th></tr>${S.analyses.map(x=>`<tr><td>${x.id}</td><td>${esc(aname(x.aid))}</td><td>${esc(x.cat)}</td><td>${bd(x.sev)}</td><td>${bd(x.status)}</td><td><button class="btn2 !py-1" onclick="CUR='${x.id}';rpanel()">View</button></td></tr>`).join('')||'<tr><td colspan="6">None yet.</td></tr>'}</table></div>`};
function fillEv(){const a=$('#sa');if(!a)return;$('#se').innerHTML=S.evidence.filter(e=>e.aid==a.value&&e.ftype.startsWith('image')).map(e=>`<option value="${e.id}">${e.id} · ${e.cat}</option>`).join('')||'<option value="">No image evidence for this asset</option>'}
function runAI(){const e=ev($('#se').value);if(!e)return toast('Select image evidence first (upload one in Evidence Centre).',1);const x={id:nid('a'),aid:e.aid,eid:e.id,...mk(e),status:'pending',comments:'',demo:true,created:TODAY};S.analyses.push(x);CUR=x.id;log('Demo analysis '+x.id+' saved as draft');save();toast('Demo analysis generated (not real AI inference).');rpanel()}
function rpanel(){const x=S.analyses.find(a=>a.id==CUR),p=$('#rp');if(!p)return;if(!x){p.innerHTML='';return}const e=ev(x.eid);p.innerHTML=`<div class="card grid md:grid-cols-2 gap-4"><div><img src="${img(e)}" class="rounded w-full" alt=""><div class="text-xs text-slate-500 mt-1">${e.id} · ${esc(aname(x.aid))}</div></div><div class="text-sm space-y-2"><div class="flex gap-2 items-center"><b>${x.id}</b> ${bd(x.status)} <span class="text-xs bg-amber-100 px-2 rounded">DEMO · not real inference</span></div><div><b>Possible defect:</b> ${esc(x.cat)}</div><div><b>Visible observations:</b> ${esc(x.obs)}</div><div><b>Visual basis:</b> ${esc(x.vis)}</div><div><b>Severity estimate:</b> ${bd(x.sev)}</div><div><b>Confidence:</b> ${x.conf}</div><div><b>Suggested next steps:</b> ${esc(x.steps)}</div><div><b>Limitations:</b> ${esc(x.lim)}</div><label class="block"><b>Engineer comments</b><textarea id="cm" class="inp" rows="2">${esc(x.comments)}</textarea></label>
<div class="flex flex-wrap gap-2"><button class="btn2" onclick="svAn('${x.id}',0)">Save comments</button><button class="btn2" onclick="svAn('${x.id}',1)">Mark reviewed</button><button class="btn" onclick="taskForm('${x.id}')">Create inspection task</button></div></div></div>`}
function svAn(id,r){const x=S.analyses.find(a=>a.id==id);x.comments=$('#cm').value;if(r){x.status='reviewed';log('Analysis '+id+' reviewed by engineer')}save();toast(r?'Marked reviewed.':'Saved.');rpanel()}
const PF={a:'',s:'',p:'',e:''};
V.planner=()=>{setTimeout(tlist);return`<div class="flex flex-wrap gap-2 items-center mb-4"><h1 class="text-2xl font-bold flex-1">Inspection Planner</h1><button class="btn" onclick="taskForm()">+ New task</button></div><div class="card mb-3 grid sm:grid-cols-4 gap-2"><select class="inp !mt-0" onchange="PF.a=this.value;tlist()">${aopts(PF.a,1)}</select><select class="inp !mt-0" onchange="PF.s=this.value;tlist()"><option value="">Any status</option>${opts(ST,PF.s)}</select><select class="inp !mt-0" onchange="PF.p=this.value;tlist()"><option value="">Any priority</option>${opts(PRI,PF.p)}</select><select class="inp !mt-0" onchange="PF.e=this.value;tlist()"><option value="">Any engineer</option>${opts(ENG,PF.e)}</select></div><div id="list"></div><p class="text-xs text-slate-500 mt-3">AI recommendations remain suggestions until a human engineer reviews them.</p>`};
function tlist(){const l=S.tasks.filter(t=>(!PF.a||t.aid==PF.a)&&(!PF.s||t.status==PF.s)&&(!PF.p||t.pri==PF.p)&&(!PF.e||t.eng==PF.e)).sort((a,b)=>a.due<b.due?-1:1);if(!$('#list'))return;
$('#list').innerHTML=l.length?`<div class="card overflow-x-auto"><table class="w-full"><tr><th>ID</th><th>Task</th><th>Asset</th><th>Priority</th><th>Engineer</th><th>Due</th><th>Status</th><th></th></tr>${l.map(t=>`<tr class="${overdue(t)?'bg-red-50':''}"><td>${t.id}</td><td>${esc(t.title)}</td><td>${esc(A(t.aid)?.code)}</td><td>${bd(t.pri)}</td><td>${esc(t.eng)}</td><td>${t.due}${overdue(t)?' <b class="text-red-600">overdue</b>':''}</td><td>${bd(t.status)}</td><td><button class="btn2 !py-1" onclick="tDetail('${t.id}')">Open</button></td></tr>`).join('')}</table></div>`:'<div class="card text-sm text-slate-500">No tasks match.</div>'}
function taskForm(anid){const x=anid&&S.analyses.find(a=>a.id==anid);fm(x?'Create task from finding '+anid:'New inspection task',[['aid','Asset','select',live().map(a=>[a.id,a.code+' · '+a.name])],['title','Title','text',0,1],['desc','Description','textarea'],['pri','Priority','select',PRI],['eng','Assigned engineer','select',ENG],['due','Due date','date',0,1]],v=>{if(v.due<TODAY)return'Due date cannot be in the past.';S.tasks.push({id:nid('t'),...v,status:'assigned',anid:anid||null,notes:'',summary:'',created:TODAY});log('Task created: '+v.title);save();toast('Task created and assigned.');if(!$('#list'))location.hash='planner'},x?{aid:x.aid,title:'Inspect: '+x.cat,desc:x.steps+' (AI suggestion, engineer to confirm)',pri:x.sev=='low'?'low':x.sev=='medium'?'medium':'high'}:{})}
function tDetail(id){const t=S.tasks.find(x=>x.id==id),ev2=S.evidence.filter(e=>e.aid==t.aid).slice(0,4),an=t.anid&&S.analyses.find(a=>a.id==t.anid);
M(`<h3 class="font-semibold text-lg">${t.id} · ${esc(t.title)}</h3><div class="text-sm my-2 space-y-1"><div>${esc(aname(t.aid))}</div><div>${esc(t.desc)}</div><div>Linked analysis: ${an?an.id+' ('+esc(an.cat)+', '+an.status+')':'none'} · Related evidence: ${ev2.map(e=>e.id).join(', ')||'none'}</div></div><form id="tf" class="space-y-2 text-sm"><div class="grid grid-cols-3 gap-2"><label>Status<select name="status" class="inp">${opts(ST,t.status)}</select></label><label>Engineer<select name="eng" class="inp">${opts(ENG,t.eng)}</select></label><label>Due<input type="date" name="due" value="${t.due}" class="inp"></label></div><label class="block">Engineer notes / findings<textarea name="notes" class="inp" rows="2">${esc(t.notes)}</textarea></label><label class="block">Completion summary<textarea name="summary" class="inp" rows="2">${esc(t.summary)}</textarea></label><p id="fe" class="text-red-600"></p><div class="flex justify-end gap-2"><button type="button" class="btn2" onclick="X()">Close</button><button class="btn">Save</button></div></form>`);
$('#tf').onsubmit=e=>{e.preventDefault();const f=e.target;if(f.status.value=='completed'&&!f.summary.value.trim()){$('#fe').textContent='Add a completion summary before completing.';return}Object.assign(t,{status:f.status.value,eng:f.eng.value,due:f.due.value,notes:f.notes.value,summary:f.summary.value});if(t.status=='completed'){const a=A(t.aid);a.last=TODAY;log('Inspection completed: '+t.title)}else log('Task '+t.id+' → '+t.status);save();toast('Task updated.');X();render()}}
function csv(rows,name){const c=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name;a.click();toast('CSV exported.')}
const RF={a:'',f:'',t:''};
function rdata(){return{ts:S.tasks.filter(t=>(!RF.a||t.aid==RF.a)&&(!RF.f||t.due>=RF.f)&&(!RF.t||t.due<=RF.t)),an:S.analyses.filter(x=>!RF.a||x.aid==RF.a),as:live().filter(a=>!RF.a||a.id==RF.a)}}
V.reports=()=>{const{ts,an,as}=rdata(),pend=S.evidence.filter(e=>e.status=='pending'&&(!RF.a||e.aid==RF.a));return`<h1 class="text-2xl font-bold mb-4">Reports</h1><div class="card mb-4 np grid sm:grid-cols-5 gap-2 items-end"><label class="text-sm">Asset<select class="inp" onchange="RF.a=this.value;render()">${aopts(RF.a,1)}</select></label><label class="text-sm">Due from<input type="date" class="inp" value="${RF.f}" onchange="RF.f=this.value;render()"></label><label class="text-sm">to<input type="date" class="inp" value="${RF.t}" onchange="RF.t=this.value;render()"></label><button class="btn" onclick="csv([['Task','Asset','Priority','Engineer','Due','Status','Summary'],...rdata().ts.map(t=>[t.id+' '+t.title,A(t.aid)?.code,t.pri,t.eng,t.due,t.status,t.summary])],'nexus-tasks.csv')">Export CSV</button><button class="btn2" onclick="print()">Print / Save PDF</button></div>
<div class="text-xs text-slate-500 mb-2">NEXUS INFRA report · generated ${TODAY} · demo data</div><div class="grid md:grid-cols-2 gap-4"><div class="card"><h3 class="font-semibold mb-2">Asset condition</h3>${bars(cnt(as,a=>a.cond))}</div><div class="card"><h3 class="font-semibold mb-2">AI findings by category</h3>${bars(cnt(an,a=>a.cat),'bg-blue-600')}</div><div class="card"><h3 class="font-semibold mb-2">Open tasks by priority</h3>${bars(cnt(ts.filter(t=>t.status!='completed'),t=>t.pri))}</div><div class="card text-sm space-y-1"><div>Inspections overdue: <b>${as.filter(a=>stat(a)=='overdue').length}</b> · due within 30 days: <b>${as.filter(a=>stat(a)=='due soon').length}</b></div><div>Evidence awaiting review: <b>${pend.length}</b></div><div>Completed inspections: <b>${ts.filter(t=>t.status=='completed').length}</b></div><div>Overdue tasks: <b>${ts.filter(overdue).length}</b></div></div></div>`};
V.settings=()=>`<h1 class="text-2xl font-bold mb-4">Settings</h1><div class="card space-y-3 text-sm"><div><b>Mode:</b> Demo role switching (no real authentication) and Demo AI mode. Data lives in this browser only (localStorage).</div><div><b>Current role:</b> ${S.role}</div>${adm()?'<button class="btn" onclick="resetDemo()">Reset demo data</button>':'<p class="text-slate-500">Reset is Administrator-only.</p>'}</div>`;
function resetDemo(){M('<p class="mb-4">Reset all data (including uploads) to the original demo records?</p><div class="flex justify-end gap-2"><button class="btn2" onclick="X()">Cancel</button><button class="btn" onclick="S=seed();save();X();toast(\'Demo data reset.\');render()">Reset</button></div>')}
const NAV=[['dashboard','Dashboard'],['assets','Infrastructure Assets'],['evidence','Evidence Centre'],['analysis','AI Defect Analysis'],['planner','Inspection Planner'],['reports','Reports'],['settings','Settings']];
function render(){const[r,p]=(location.hash.slice(1)||'dashboard').split('/'),k=V[r]?r:'dashboard';$('#role').value=S.role;$('#nav').innerHTML=NAV.map(([h,l])=>`<a href="#${h}" class="nav ${h==k||(k=='asset'&&h=='assets')?'on':''}" onclick="sb.classList.add('-translate-x-full')">${l}</a>`).join('');$('#main').innerHTML=V[k](p);scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
